<body>

  <!-- Main Application Fluid Container -->
  <div class="container-fluid px-1 py-3 main-wrapper">
    
    <!-- Top Header Banner Graphic -->
    <header class="top-banner">
      <img src="images/headerBanner.png" alt="Header Banner for Dashboard">
    </header>

    <!-- Main Dashboard Body Layout -->
    <div class="dashboard-body d-flex position-relative flex-grow-1">
      
      <!-- Collapsible Filter Sidebar Wrapper -->
      <div class="sidebar-wrapper position-relative" id="sidebarWrapper">
        
        <!-- Sidebar Collapse / Expand Toggle Button -->
        <button id="toggleFilterBtn" class="filter-toggle-btn" type="button" aria-label="Toggle Filters" title="Hide Filters">
          <span id="toggleIcon" class="toggle-arrow">&#10094;</span>
        </button>

        <!-- Filter Controls Panel -->
        <div class="filter-panel">
          <h5 class="mb-3">Selections</h5>

          <!-- Text Search Global Override Filter -->
          <style>
            #searchInput::placeholder {
              color: #5d5f61;
              opacity: 1;
            }
          </style>
          <div class="mb-3">
            <label for="searchInput" class="form-label fw-semibold">Team Search</label>
            <input type="text" id="searchInput" class="form-control" placeholder="Search teams...">
          </div>

          <!-- Date / Day Filter Slicer -->
          <div class="mb-3">
            <label for="dateFilter" class="form-label fw-semibold">Day/Date</label>
            <select id="dateFilter" class="form-select"></select>
          </div>

          <!-- Sports League Dynamic Filter Container -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Sport/League</label>
            <div id="leagueFilter" class="checkbox-panel"></div>
          </div>

          <!-- Ranked Teams Toggle Checkbox -->
          <div class="mb-3 ranked-toggle-wrapper">
            <div class="form-check d-flex align-items-center gap-2 ps-0">
              <input class="form-check-input ms-0" type="checkbox" id="rankedFilter">
              <label class="form-check-label fw-semibold mb-0" for="rankedFilter">
                Ranked NCAA Teams
              </label>
            </div>
          </div>

          <!-- Event Start Time Dynamic Filter Container -->
          <div class="mb-3">
            <label for="timeFilter" class="form-label fw-semibold">Scheduled Start</label>
            <div id="timeFilter" class="checkbox-panel"></div>
          </div>

          <!-- Conference Dynamic Filter Container -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Conference</label>
            <div id="conferenceFilter" class="checkbox-panel"></div>
          </div>

          <!-- TV Network Excel-Style Searchable Dropdown Filter -->
          <!-- Network/Platform Dropdown Search Override -->
          <style>
            #networkSearchInput::placeholder {
            color: #5d5f61;
            opacity: 1;
            }
          </style>
          <div class="mb-3">
            <label class="form-label fw-semibold">Network/Platform</label>
              <div class="excel-dropdown" id="networkDropdown">
                <button type="button" class="excel-dropdown-btn form-select text-start" id="networkDropdownBtn" aria-expanded="false">
                  <span class="excel-btn-text">All Networks/Platforms</span>
                </button>
                <div class="excel-dropdown-menu" id="networkDropdownMenu">
                  <div class="excel-search-wrapper">
                    <input type="text" id="networkSearchInput" class="form-control form-control-sm" placeholder="Deselect All to Search..." autocomplete="off">
                      <button type="button" class="excel-search-clear d-none" id="networkSearchClear" title="Clear search">&times;</button>
                  </div>
                  <div id="networkFilter" class="excel-checkbox-list"></div>
                </div>
              </div>
          </div>

          <!-- Matchup Excel-Style Searchable Dropdown Filter -->
          <!-- Matchup/Event Dropdown Search Override -->
          <style>
            #matchupSearchInput::placeholder {
              color: #5d5f61;
              opacity: 1;
            }
          </style>
          <div class="mb-3">
            <label class="form-label fw-semibold">Matchup/Event</label>
              <div class="excel-dropdown" id="matchupDropdown">
                <button type="button" class="excel-dropdown-btn form-select text-start" id="matchupDropdownBtn" aria-expanded="false">
                  <span class="excel-btn-text">All Events</span>
                </button>
                <div class="excel-dropdown-menu" id="matchupDropdownMenu">
                  <div class="excel-search-wrapper">
                    <input type="text" id="matchupSearchInput" class="form-control form-control-sm" placeholder="Deselect All to Search..." autocomplete="off">
                    <button type="button" class="excel-search-clear d-none" id="matchupSearchClear" title="Clear search">&times;</button>
                  </div>
                  <div id="matchupFilter" class="excel-checkbox-list"></div>
                </div>
              </div>
          </div>

        </div>
      </div>

      <!-- Charts Visualization Column -->
      <div class="charts-column flex-grow-1" id="chartsColumn">
        
        <!-- Linear Broadcast Networks Chart Container -->
        <div class="chart-container top-chart" id="networkChartContainer">
          <h6 class="mb-2 chart-title"><span class="chart-date-label"></span> &mdash; Linear Broadcast Networks <i class="timezone-note">(in User Time)</i></h6>
          <div id="barChart" class="plotly-chart"></div>
        </div>

        <!-- Digital Streaming Platforms Chart Container -->
        <div class="chart-container top-chart" id="digitalChartContainer">
          <h6 class="mb-2 chart-title"><span class="chart-date-label"></span> &mdash; Digital Streaming Platforms <i class="timezone-note">(in User Time)</i></h6>
          <div id="digitalChart" class="plotly-chart"></div>
        </div>

      </div>

    </div>
  </div>

  <!-- External JavaScript Libraries (D3.js & Plotly.js CDNs) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-4.0.0.min.js"></script>
